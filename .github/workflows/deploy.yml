name: Deploy

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP 🔧
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, xml
          coverage: none
          tools: composer:v2

      - name: Install and Build 🔧
        run: |
          composer install

      - name: Generate
        env:
          APP_NAME: Sajya
          APP_ENV: production
          APP_KEY: base64:8Jv9H6OMWkWui9VzMwjSiLPfMqRnZGN0PNVUmMc5Dyc=
          APP_DEBUG: true
          APP_URL: https://sajya.github.io
        run: |
          php artisan export

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
